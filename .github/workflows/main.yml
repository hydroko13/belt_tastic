name: Build

on:
  push:
  pull_request:

jobs:

  # ============================================================
  # Linux AMD64
  # ============================================================
  linux-amd64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Build
        run: |
          odin build . -out:belt-tastic -o:aggressive

      - name: Package
        run: |
          mkdir belt-tastic-linux-amd64
          cp belt-tastic belt-tastic-linux-amd64/
          cp -r res belt-tastic-linux-amd64/
          zip -r belt-tastic-linux-amd64.zip belt-tastic-linux-amd64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-linux-amd64
          path: belt-tastic-linux-amd64.zip


  # ============================================================
  # Linux ARM64
  # ============================================================
  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Build
        run: |
          odin build . -out:belt-tastic -o:aggressive

      - name: Package
        run: |
          mkdir belt-tastic-linux-arm64
          cp belt-tastic belt-tastic-linux-arm64/
          cp -r res belt-tastic-linux-arm64/
          zip -r belt-tastic-linux-arm64.zip belt-tastic-linux-arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-linux-arm64
          path: belt-tastic-linux-arm64.zip


  # ============================================================
  # Windows AMD64
  # ============================================================
  windows-amd64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          odin build . -out:belt-tastic.exe -o:aggressive

      - name: Package
        shell: bash
        run: |
          mkdir belt-tastic-windows-amd64
          cp belt-tastic.exe belt-tastic-windows-amd64/
          cp -r res belt-tastic-windows-amd64/
          7z a belt-tastic-windows-amd64.zip belt-tastic-windows-amd64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-windows-amd64
          path: belt-tastic-windows-amd64.zip


  # ============================================================
  # Windows ARM64
  # ============================================================
  windows-arm64:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          odin build . -out:belt-tastic.exe -o:aggressive

      - name: Package
        shell: bash
        run: |
          mkdir belt-tastic-windows-arm64
          cp belt-tastic.exe belt-tastic-windows-arm64/
          cp -r res belt-tastic-windows-arm64/
          7z a belt-tastic-windows-arm64.zip belt-tastic-windows-arm64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-windows-arm64
          path: belt-tastic-windows-arm64.zip


  # ============================================================
  # macOS AMD64
  # ============================================================
  macos-amd64:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          odin build . -out:belt-tastic-amd64 -o:aggressive

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-macos-amd64
          path: belt-tastic-amd64


  # ============================================================
  # macOS ARM64
  # ============================================================
  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          odin build . -out:belt-tastic-arm64 -o:aggressive

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-macos-arm64
          path: belt-tastic-arm64


  # ============================================================
  # macOS Universal
  # ============================================================
  macos-universal:
    needs:
      - macos-amd64
      - macos-arm64
  
    runs-on: macos-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
  
      - name: Download AMD64 build
        uses: actions/download-artifact@v5
        with:
          name: belt-tastic-macos-amd64
          path: amd64
  
      - name: Download ARM64 build
        uses: actions/download-artifact@v5
        with:
          name: belt-tastic-macos-arm64
          path: arm64
  
      - name: Create universal binary
        run: |
          lipo -create \
            amd64/belt-tastic-amd64 \
            arm64/belt-tastic-arm64 \
            -output belt-tastic
  
      - name: Package
        run: |
          mkdir belt-tastic-macos-universal
          cp belt-tastic belt-tastic-macos-universal/
          cp -r res belt-tastic-macos-universal/
          zip -r belt-tastic-macos-universal.zip belt-tastic-macos-universal
  
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: belt-tastic-macos-universal
          path: belt-tastic-macos-universal.zip